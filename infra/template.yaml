AWSTemplateFormatVersion: '2010-09-09'
Description: The rustatian.me hosted zone and the static homepage on S3 and CloudFront.

Parameters:
  # The repository is public, so the address is a stack parameter.
  AlarmEmail:
    Type: String
    NoEcho: true
    Description: The email address that gets the DNSSEC alarms.

Resources:
  # Retain: the registration names the name servers of this zone, and a new zone gets other ones.
  # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-deletionpolicy.html
  # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-updatereplacepolicy.html
  # https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/DeleteHostedZone.html
  HostedZone:
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: rustatian.me

  # The homelab DNS update job owns the temporal and vpn records.

  # The name servers of the zone slowo.rustatian.me in the stack slowo-shared of rustatian/jak-tam-to-slowo (eu-central-1). The values are copies, so this stack does not depend on that stack. That zone has Retain, so its name servers do not change.
  # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/intrinsic-function-reference-getstackoutput.html
  SlowoDelegation:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: slowo.rustatian.me
      Type: NS
      TTL: '3600'
      ResourceRecords:
        - ns-294.awsdns-36.com
        - ns-1248.awsdns-28.org
        - ns-902.awsdns-48.net
        - ns-1891.awsdns-44.co.uk

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: rustatian.me
      SubjectAlternativeNames:
        - www.rustatian.me
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: rustatian.me
          HostedZoneId: !Ref HostedZone
        - DomainName: www.rustatian.me
          HostedZoneId: !Ref HostedZone

  # By default, new buckets allow no public access and encrypt new objects.
  # https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
  # https://docs.aws.amazon.com/AmazonS3/latest/userguide/default-bucket-encryption.html
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub rustatian-me-site-${AWS::AccountId}

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${Bucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: rustatian-me-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The AWS index.html example with /api/ excluded, because the GitHub data files have no extension.
  # src/__tests__/indexFunction.test.ts runs this code.
  # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/example_cloudfront_functions_url_rewrite_single_page_apps_section.html
  IndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: rustatian-me-index
      AutoPublish: true
      FunctionConfig:
        Comment: Maps directory paths to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        async function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!uri.includes('.') && !uri.startsWith('/api/')) {
            request.uri += '/index.html';
          }
          return request;
        }

  HeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: rustatian-me-headers
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            # The sha256 source allows the inline theme script of index.html. src/__tests__/csp.test.ts checks it.
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' 'sha256-fGMRTOjIFy+TF/hMznDeG+wzFsBWvQM3rLgMZyfW4aA='; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; style-src 'self' https://fonts.googleapis.com"
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'geolocation=(), microphone=(), camera=()'
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true
            - Header: Cross-Origin-Resource-Policy
              Value: same-origin
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - rustatian.me
          - www.rustatian.me
        HttpVersion: http2and3
        IPV6Enabled: true
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # The managed cache policy CachingOptimized.
          # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html#managed-cache-caching-optimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref HeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexFunction.FunctionARN
        # Without s3:ListBucket, S3 answers 403 for a missing key.
        # https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404/index.html

  # Z2FDTNDATAQYW2 is the hosted zone ID of every CloudFront alias target.
  # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-route53-recordset-aliastarget.html#cfn-route53-recordset-aliastarget-hostedzoneid
  SiteRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZone
      RecordSets:
        - Name: rustatian.me
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: rustatian.me
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: www.rustatian.me
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: www.rustatian.me
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

  # Route 53 signs the zone with a key-signing key that uses this key. The key must be in us-east-1, with the key spec ECC_NIST_P256 for signing.
  # https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-configuring-dnssec-cmk-requirements.html
  # https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/access-control-managing-permissions.html#KMS-key-policy-for-DNSSEC
  DnssecKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Route 53 DNSSEC key-signing key of rustatian.me
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          # The default key policy statement: the account and its IAM policies manage the key.
          # https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-default.html#key-policy-default-allow-root-enable-iam
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
          - Sid: Allow Route 53 DNSSEC Service
            Effect: Allow
            Principal:
              Service: dnssec-route53.amazonaws.com
            Action:
              - kms:DescribeKey
              - kms:GetPublicKey
              - kms:Sign
            Resource: '*'
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                AWS:SourceArn: !Sub 'arn:aws:route53:::hostedzone/${HostedZone}'
          - Sid: Allow Route 53 DNSSEC to CreateGrant
            Effect: Allow
            Principal:
              Service: dnssec-route53.amazonaws.com
            Action: kms:CreateGrant
            Resource: '*'
            Condition:
              Bool:
                kms:GrantIsForAWSResource: true

  # The name allows only letters, digits and underscores.
  # A replacement of this resource or of DnssecKey makes a new key that does not match the DS record at the domain registration.
  # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-route53-keysigningkey.html#cfn-route53-keysigningkey-name
  KeySigningKey:
    Type: AWS::Route53::KeySigningKey
    Properties:
      HostedZoneId: !Ref HostedZone
      KeyManagementServiceArn: !GetAtt DnssecKey.Arn
      Name: rustatian_me
      Status: ACTIVE

  # Signing needs an ACTIVE key-signing key, and no property of this resource refers to it.
  # https://docs.aws.amazon.com/Route53/latest/APIReference/API_EnableHostedZoneDNSSEC.html#API_EnableHostedZoneDNSSEC_Errors
  Dnssec:
    Type: AWS::Route53::DNSSEC
    DependsOn: KeySigningKey
    Properties:
      HostedZoneId: !Ref HostedZone

  # The subscription sends a confirmation email first. Alarms reach the address only after the confirmation.
  # SNS deletes a subscription that is not confirmed in 48 hours, and a stack update without changes does not make it again.
  # https://docs.aws.amazon.com/sns/latest/dg/sns-email-notifications.html
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: rustatian-me-alarms
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # Route 53 publishes the DNSSEC metrics in us-east-1, one data point per 4 hours, so the period is 4 hours.
  # https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/monitoring-hosted-zones-with-cloudwatch.html#cloudwatch-metrics-route-53-hosted-zones
  DnssecInternalFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: rustatian-me-dnssec-internal-failure
      AlarmDescription: A DNSSEC object of the rustatian.me zone is in the state INTERNAL_FAILURE.
      Namespace: AWS/Route53
      MetricName: DNSSECInternalFailure
      Dimensions:
        - Name: HostedZoneId
          Value: !Ref HostedZone
      Statistic: Sum
      Period: 14400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # ACTION_NEEDED means that Route 53 cannot use DnssecKey. When the current signatures expire, validating resolvers return SERVFAIL for the zone.
  # https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-configuring-dnssec-troubleshoot.html
  DnssecKeyActionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: rustatian-me-dnssec-ksk-action-needed
      AlarmDescription: A key-signing key of the rustatian.me zone is in the state ACTION_NEEDED.
      Namespace: AWS/Route53
      MetricName: DNSSECKeySigningKeysNeedingAction
      Dimensions:
        - Name: HostedZoneId
          Value: !Ref HostedZone
      Statistic: Sum
      Period: 14400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # The deploy workflow can only upload the site and clear the cache. A person deploys this stack.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: rustatian-me-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # Created by the Terraform in rapira-rs/benchmarks (terraform/ci). This stack must not declare it.
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                # The repository uses immutable subject claims: https://docs.github.com/en/actions/reference/security/oidc#immutable-subject-claims
                'token.actions.githubusercontent.com:sub': 'repo:rustatian@8040338/rustatian.me@975464248:ref:refs/heads/main'
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${Bucket.Arn}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  HostedZoneId:
    Value: !Ref HostedZone
  NameServers:
    Value: !Join [',', !GetAtt HostedZone.NameServers]
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
